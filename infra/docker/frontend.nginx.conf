server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, looked up per request: the container starts even before the
    # backend service resolves, and follows the backend when compose recreates it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    # Same shape as the Vite dev proxy and the CloudFront SPA fallback: /api reaches the
    # backend, every other path is the single-page app.
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
